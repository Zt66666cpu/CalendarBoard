<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CalendarBoard</title>
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <div id="shell" class="shell">
    <!-- Left panel: Full Monthly Calendar (visible on the month surface) -->
    <section class="calendar-pane" aria-label="月历视图">
      <header class="cal-header">
        <div>
          <h2 id="monthTitle">2026年11月</h2>
        </div>
        <div class="cal-actions">
          <button id="prevMonth" class="ghost-btn icon-only" type="button" title="上个月">‹</button>
          <button id="todayBtn" class="ghost-btn" type="button">今天</button>
          <button id="nextMonth" class="ghost-btn icon-only" type="button" title="下个月">›</button>
          <button id="quickAddTop" class="primary-btn" type="button">＋ 新增事项</button>
        </div>
      </header>

      <div class="weekdays" aria-hidden="true">
        <span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span>
      </div>

      <div id="monthGrid" class="month-grid"></div>
    </section>

    <!-- Right panel: Today / month detail -->
    <aside class="sidebar-pane" aria-label="今日面板">
      <div class="sidebar-toolbar">
        <div class="toolbar-left">
          <button id="expandToggle" class="pill-btn" type="button" title="切换月历 / 今日">
            <span id="expandLabel">月历</span>
          </button>
        </div>
        <div class="toolbar-right">
          <button id="quickAddBtn" class="icon-btn" type="button" title="自然语言快速添加">＋</button>
          <button id="syncBtn" class="icon-btn" type="button" title="立即同步">↻</button>
          <button id="settingsBtn" class="icon-btn" type="button" title="设置与云端账号">⚙</button>
        </div>
      </div>

      <div class="today-head">
        <div class="today-head-row">
          <div id="selectedTitle" class="selected-title">11月20日 · 周五</div>
          <span id="modeBadge" class="mode-badge demo">演示模式</span>
        </div>
        <div id="selectedSubtitle" class="selected-sub">点「＋」给这天添加事项</div>
      </div>

      <div class="view-tabs" role="tablist">
        <button id="tabDay" class="tab-btn active" type="button" role="tab">当天安排</button>
        <button id="tabWeek" class="tab-btn" type="button" role="tab">未来 7 天</button>
      </div>

      <div id="dayView" class="sidebar-scroll">
        <div id="reviewBanner" class="review-banner hidden"></div>

        <section class="cat-group" data-type="课程">
          <div class="cat-header">
            <div class="cat-title"><span class="cat-dot course"></span>课程<span id="countCourse" class="cat-count">0</span></div>
            <button class="add-mini" type="button" data-add-type="课程" title="添加课程">＋</button>
          </div>
          <div id="listCourse" class="cat-list"></div>
        </section>

        <section class="cat-group" data-type="待办">
          <div class="cat-header">
            <div class="cat-title"><span class="cat-dot todo"></span>待办<span id="countTodo" class="cat-count">0</span></div>
            <button class="add-mini" type="button" data-add-type="待办" title="添加待办">＋</button>
          </div>
          <div id="listTodo" class="cat-list"></div>
        </section>

        <section id="groupPending" class="cat-group hidden" data-type="待处理">
          <div class="cat-header">
            <div class="cat-title"><span class="cat-dot todo"></span>待处理<span id="countPending" class="cat-count">0</span></div>
            <button id="openReviewBtn" class="pill-btn" type="button">去回顾</button>
          </div>
          <div id="listPending" class="cat-list"></div>
        </section>

        <section class="cat-group" data-type="日程">
          <div class="cat-header">
            <div class="cat-title"><span class="cat-dot schedule"></span>日程<span id="countSchedule" class="cat-count">0</span></div>
            <button class="add-mini" type="button" data-add-type="日程" title="添加日程">＋</button>
          </div>
          <div id="listSchedule" class="cat-list"></div>
        </section>
      </div>

      <div id="weekView" class="sidebar-scroll hidden"></div>
      <div id="reviewView" class="sidebar-scroll hidden"></div>
      <div id="archiveView" class="sidebar-scroll hidden"></div>

      <footer class="sidebar-footer">
        <span id="statusText" class="status-text">演示模式</span>
        <button id="archiveToggleBtn" class="pill-btn" type="button">归档</button>
        <button id="connectBannerBtn" class="link-btn" type="button">连接云端</button>
      </footer>
    </aside>
  </div>

  <!-- Natural-language quick add surface -->
  <section id="quickAddView" class="quick-add-view hidden" aria-label="快速添加">
    <div class="quick-add-head">
      <span class="quick-add-title">快速添加</span>
      <button id="quickAddTypeBadge" class="quick-add-badge schedule" type="button" title="点击或按 Tab 切换日程 / 待办">日程</button>
    </div>
    <input id="quickAddInput" class="quick-add-input" type="text" placeholder="例如：明天下午3点 交实验报告（Tab 切换待办/日程）" autocomplete="off">
    <div id="quickAddPreview" class="quick-add-preview" aria-live="polite"></div>
    <div class="quick-add-hint">Enter 保存并收起 · Tab 切换类别 · Esc 取消</div>
    <div class="quick-add-actions">
      <button id="quickAddCancel" class="ghost-btn" type="button">取消</button>
      <button id="quickAddSave" class="primary-btn" type="button">保存</button>
    </div>
  </section>

  <!-- Add / Edit Entry Modal -->
  <div id="entryBackdrop" class="modal-backdrop hidden">
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="entryModalTitle">新增事项</h3>
        <button id="closeEntryModal" class="icon-btn" type="button">✕</button>
      </div>
      <form id="entryForm" class="form-stack">
        <div class="form-row-2">
          <label>
            类别
            <select id="entryType">
              <option value="课程">课程</option>
              <option value="待办">待办</option>
              <option value="日程">日程</option>
            </select>
          </label>
          <label>
            日期
            <input id="entryDate" type="date" required>
          </label>
        </div>
        <label>
          内容
          <textarea id="entryTitle" rows="2" maxlength="1000" placeholder="例如：数据结构与算法 / 完成实验报告" required></textarea>
        </label>
        <div class="form-row-2">
          <label>
            开始时间
            <input id="entryStart" type="time">
          </label>
          <label>
            结束时间
            <input id="entryEnd" type="time">
          </label>
        </div>
        <label>
          场地 / 教室
          <input id="entryPlace" type="text" maxlength="200" placeholder="可留空，如 品学楼B308">
        </label>
        <div class="modal-actions">
          <button id="deleteEntryBtn" class="danger-btn hidden" type="button">删除</button>
          <button id="openLinkBtn" class="ghost-btn hidden" type="button">打开文件</button>
          <div class="spacer"></div>
          <button id="cancelEntryBtn" class="ghost-btn" type="button">取消</button>
          <button class="primary-btn" type="submit">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Settings & Cloud Sync Modal -->
  <div id="settingsBackdrop" class="modal-backdrop hidden">
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3>设置与云端同步</h3>
        <button id="closeSettingsModal" class="icon-btn" type="button">✕</button>
      </div>

      <div class="settings-section">
        <div class="section-label">学期设置</div>
        <div class="form-row-2">
          <label>
            学期名称（1–12 个字）
            <input id="termNameInput" type="text" maxlength="12" placeholder="例如：2026秋">
          </label>
          <label>
            学期第一天
            <input id="termStartInput" type="date">
          </label>
        </div>
        <div class="form-row-2" style="margin-top:8px;">
          <label>
            学期周数（1–30）
            <input id="termWeeksInput" type="number" min="1" max="30" value="20">
          </label>
          <div style="display:flex; align-items:flex-end; justify-content:flex-end;">
            <button id="saveTermBtn" class="ghost-btn" type="button">保存学期设置</button>
          </div>
        </div>
        <div id="termSettingsMsg" class="settings-msg"></div>
      </div>

      <div class="settings-section">
        <div class="section-label">Supabase 云端连接（与网页版 / 安卓同步）</div>
        <form id="cloudConfigForm" class="form-stack compact">
          <label>
            项目 URL
            <input id="cfgUrl" type="url" placeholder="https://xxxxx.supabase.co" autocomplete="off">
          </label>
          <label>
            Publishable Key（以 sb_publishable_ 开头）
            <input id="cfgKey" type="text" placeholder="sb_publishable_..." autocomplete="off">
          </label>
          <div class="form-row-2">
            <label>
              日历账号邮箱
              <input id="authEmail" type="email" placeholder="you@example.com">
            </label>
            <label>
              密码
              <input id="authPassword" type="password" placeholder="至少 6 位">
            </label>
          </div>
          <div id="settingsMsg" class="settings-msg"></div>
          <div class="modal-actions">
            <button id="useDemoBtn" class="ghost-btn" type="button">切换演示模式</button>
            <div class="spacer"></div>
            <button id="signupBtn" class="ghost-btn" type="button">注册</button>
            <button id="loginBtn" class="primary-btn" type="submit">保存并登录</button>
          </div>
          <div id="loggedInRow" class="logged-in-row hidden">
            <span id="loggedInUser">已登录云端账号</span>
            <button id="logoutBtn" class="danger-btn" type="button">退出登录</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="core.js"></script>
  <script src="vendor/chrono.min.js"></script>
  <script src="quickadd-parser.js"></script>
  <script src="widget.js"></script>
</body>
</html>
