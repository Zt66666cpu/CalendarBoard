[Rainmeter]
Update=60000
AccurateText=1
DynamicWindowSize=0
DefaultKeepOnScreen=0
DefaultSavePosition=0
DefaultDraggable=0
DefaultSnapEdges=0
OnRefreshAction=[!KeepOnScreen 0][!Draggable 0][!SnapEdges 0][!ClickThrough 0][!CommandMeasure MeasureSlide "Reset()"][!CommandMeasure MeasureDateCheck "Check()"]
MouseOverAction=[!CommandMeasure MeasureSlide "Expand()"][!CommandMeasure MeasureSlideTimer "Stop 1"][!CommandMeasure MeasureSlideTimer "Execute 1"]
MouseLeaveAction=[!CommandMeasure MeasureSlide "Collapse()"][!CommandMeasure MeasureSlideTimer "Stop 1"][!CommandMeasure MeasureSlideTimer "Execute 1"]

[Metadata]
Name=CalendarBoard
Author=Codex
Information=Monthly calendar with local events and today sidebar
Version=1.0

[Variables]
@include=#@#CalendarData.inc
TextColor=255,255,255,255
MutedColor=218,222,226,255
AccentColor=245,247,249,255
GlassAlpha=105
DockVisibleWidth=476
DockWidth=1875

[MeasureSlide]
Measure=Script
ScriptFile=#@#Slide.lua
UpdateDivider=-1

[MeasureSlideTimer]
Measure=Plugin
Plugin=ActionTimer
UpdateDivider=-1
ActionList1=Repeat SlideTick,20,14
SlideTick=[!CommandMeasure MeasureSlide "Step()"]

[MeasureDateCheck]
Measure=Script
ScriptFile=#@#DateCheck.lua
UpdateDivider=1

[MeasureMaintenanceTick]
Measure=Time
Format=%Y%m%d%H%M
UpdateDivider=5
OnChangeAction=[!CommandMeasure MeasureSync "Run"]

[MeasureSync]
Measure=Plugin
Plugin=RunCommand
UpdateDivider=-1
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Sync.ps1"
State=Hide
Timeout=300000
FinishAction=[!CommandMeasure MeasureRender "Run"]

[MeasureRender]
Measure=Plugin
Plugin=RunCommand
UpdateDivider=-1
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Render.ps1" -Action Render
State=Hide
Timeout=30000
FinishAction=[!Refresh "CalendarBoard"]

