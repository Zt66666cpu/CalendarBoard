[BoardBackground]
Meter=Shape
UpdateDivider=-1
Shape=Rectangle 0,0,1875,1103,27 | Fill Color 0,0,0,#GlassAlpha# | Stroke Color 255,255,255,65 | StrokeWidth 1

[SidebarPanel]
Meter=Shape
UpdateDivider=-1
Shape=Rectangle 23,137,432,929,18 | Fill Color 255,255,255,14 | StrokeWidth 0

[Divider]
Meter=Shape
UpdateDivider=-1
Shape=Line 476,39,476,1062 | Stroke Color 255,255,255,55 | StrokeWidth 1

[MeasureSidebarClock]
Measure=Time
Format=%H:%M
UpdateDivider=1

[SidebarClock]
Meter=String
MeasureName=MeasureSidebarClock
X=42
Y=10
W=390
H=65
FontFace=Segoe UI
FontSize=38
FontWeight=700
FontColor=255,255,255,255
AntiAlias=1
UpdateDivider=1
ToolTipText=Windows 系统时间 · 每分钟更新

[TodayHeader]
Meter=String
UpdateDivider=-1
Text=#SelectedTitle#
X=42
Y=80
FontFace=Microsoft YaHei
FontSize=20
FontWeight=700
FontColor=#TextColor#
AntiAlias=1

[SidebarHint]
Meter=String
UpdateDivider=-1
Text=#WeekInfo# · 点「＋」给这天添加
X=42
Y=118
FontFace=Microsoft YaHei
FontSize=12
FontColor=#MutedColor#
AntiAlias=1

