name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK Platform 35 & Build Tools
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CalendarBoard-v2.0-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalendarBoard-v2.0-debug-apk
          path: CalendarBoard-v2.0-debug.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v2.0 >/dev/null 2>&1; then
            gh release upload v2.0 CalendarBoard-v2.0-debug.apk --clobber
          else
            gh release create v2.0 CalendarBoard-v2.0-debug.apk \
              --title "CalendarBoard Android v2.0 (暖米白针织极简风)" \
              --notes "全新重做的 CalendarBoard 安卓 v2.0：暖米白针织纹理 + 大圆角完整月历 App、直接增删改查与待办勾选、以及暖米白针织桌面小组件。"
          fi
