name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK Platform 36 & Build Tools
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CalendarBoard-v3.0-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalendarBoard-v3.0-debug-apk
          path: CalendarBoard-v3.0-debug.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v3.0 >/dev/null 2>&1; then
            gh release upload v3.0 CalendarBoard-v3.0-debug.apk --clobber
          else
            gh release create v3.0 CalendarBoard-v3.0-debug.apk \
              --title "CalendarBoard Android v3.0" \
              --notes "CalendarBoard 三端 v3.0：macOS 纯黑课程岛与拖拽建待办；Web / Android 待处理分组、每日回顾、归档页与深色模式；Android 16 实时更新课程岛、大组件勾选待办、下一节课小组件与快捷方式。"
          fi
